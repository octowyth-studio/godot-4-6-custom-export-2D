name: Build compatible Gem Workshop Web template

on:
  workflow_dispatch:
    inputs:
      godot_ref:
        description: Match the Godot editor used to export the game
        type: choice
        required: true
        default: 4.6.1-stable
        options:
          - 4.6-stable
          - 4.6.1-stable

permissions:
  contents: read

env:
  EMSDK_VERSION: 4.0.20

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ inputs.godot_ref }}
          path: godot
          persist-credentials: false

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install build tools
        run: |
          python3 -m venv /tmp/gem-build-tools
          /tmp/gem-build-tools/bin/pip install 'scons>=4.4,<5' brotli
          echo '/tmp/gem-build-tools/bin' >> "$GITHUB_PATH"

      - name: Check the manual configuration
        run: |
          python3 - <<'PY'
          import ast, json
          from pathlib import Path
          profile = json.loads(Path('GemWorkshop_web.gdbuild').read_text())
          assert profile['type'] == 'build_profile'
          assert profile['disabled_classes'] == [], 'Do not replace this with an auto-detected class list.'
          tree = ast.parse(Path('GemWorkshop_web.py').read_text())
          flags = {node.targets[0].id: ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)}
          for name in ('javascript_eval', 'module_gdscript_enabled', 'module_webp_enabled', 'module_mp3_enabled', 'module_freetype_enabled', 'module_msdfgen_enabled', 'module_text_server_adv_enabled'):
              assert flags.get(name) is True, f'Required feature disabled: {name}'
          for name in ('threads', 'dlink_enabled', 'wasm_simd', 'module_text_server_fb_enabled'):
              assert flags.get(name) is False, f'Incompatible build flag: {name}'
          PY

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: out/scons_cache
          key: gem-web-v2-${{ runner.os }}-${{ inputs.godot_ref }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('GemWorkshop_web.gdbuild', 'GemWorkshop_web.py', 'build_template.sh') }}

      - name: Compile release template
        run: bash build_template.sh godot out

      - name: Record source and compiler versions
        run: |
          git -C godot rev-parse HEAD > out/source_commit.txt
          emcc --version > out/compiler_version.txt
          scons --version > out/scons_version.txt
          cp GemWorkshop_web.gdbuild GemWorkshop_web.py out/

      - name: Download template and size report
        uses: actions/upload-artifact@v4
        with:
          name: gem-workshop-compatible-web-${{ inputs.godot_ref }}
          path: |
            out/web_nothreads_release.zip
            out/size_report.json
            out/source_commit.txt
            out/compiler_version.txt
            out/scons_version.txt
            out/GemWorkshop_web.gdbuild
            out/GemWorkshop_web.py
          if-no-files-found: error
          retention-days: 30
