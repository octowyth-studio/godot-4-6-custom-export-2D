name: build-web-template

on: workflow_dispatch

env:
  PROFILE: necrowake_godot_4_6.gdbuild
  GODOT_REF: 4.6-stable
  EMSDK_VERSION: 4.0.10

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_REF }}
          path: godot

      # Preflight runs before emsdk, so a bad profile fails in seconds, not hours.
      - name: Verify build profile
        run: |
          python3 - <<'PY'
          import json, os, sys

          path = os.environ["PROFILE"]
          data = json.load(open(path))
          classes = set(data["disabled_classes"])
          options = data.get("disabled_build_options", {})

          # Classes the engine cannot boot without.
          CORE = [
              "ClassDB", "Mutex", "Thread", "Semaphore", "WorkerThreadPool",
              "RenderingServer", "Script", "ScriptLanguage", "GDScriptNativeClass",
              "Window", "Theme", "ThemeDB", "ThemeContext", "InputMap", "SceneState",
              "TextServerManager", "TranslationServer", "ResourceFormatLoader",
              "ResourceFormatSaver", "ResourceSaver", "ResourceUID", "ImageTexture",
              "World2D", "Performance", "Logger", "WeakRef", "Timer", "EngineDebugger",
          ]

          # Marker string -> the class that must stay enabled to keep that string.
          MARKERS = {
              "Sprite2D": "Sprite2D",
              "ShaderMaterial": "ShaderMaterial",
              "AudioStreamOggVorbis": "AudioStreamOggVorbis",
              "FontFile": "FontFile",
              "JavaScriptBridge": "JavaScriptBridge",
              "CanvasLayer": "CanvasLayer",
          }

          # Base class -> subclasses that must be disabled together with it.
          PAIRS = {
              "CollisionObject2D": ["Area2D", "PhysicsBody2D", "CharacterBody2D", "StaticBody2D", "RigidBody2D"],
              "Shape2D": ["CircleShape2D", "RectangleShape2D", "CapsuleShape2D"],
              "AudioStreamPlayback": ["AudioStreamOggVorbis"],
              "Texture2D": ["ImageTexture", "AtlasTexture", "CompressedTexture2D"],
          }

          errors = []

          for name in CORE:
              if name in classes:
                  errors.append(f"disabled_classes has {name} - the engine will not boot")

          for marker, name in MARKERS.items():
              if name in classes:
                  errors.append(f"disabled_classes has {name} - marker '{marker}' will be stripped")

          for base, children in PAIRS.items():
              if base in classes:
                  kept = [c for c in children if c not in classes and c != base]
                  if kept:
                      errors.append(f"{base} is disabled but these subclasses stay enabled: {kept}")

          if options.get("disable_physics_2d") is True:
              kept = [c for c in ("Area2D", "CharacterBody2D", "CircleShape2D") if c not in classes]
              if kept:
                  errors.append(f"disable_physics_2d is true but these 2D physics classes stay enabled: {kept}")

          if options.get("module_msdfgen_enabled") is False and "FontVariation" not in classes:
              errors.append("msdfgen is off but FontVariation stays enabled - use bitmap fonts only")

          print(len(classes), "classes disabled")
          if errors:
              print("\nProfile is not compatible with this workflow:")
              for e in errors:
                  print(" -", e)
              sys.exit(1)
          print("profile OK")
          PY

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - run: pip install "scons>=4.4"

      - run: emcc --version

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          key: scons-web-${{ env.GODOT_REF }}-${{ env.EMSDK_VERSION }}-${{ github.run_id }}
          restore-keys: scons-web-${{ env.GODOT_REF }}-${{ env.EMSDK_VERSION }}-

      - name: Compile web template (release)
        working-directory: godot
        run: |
          scons platform=web target=template_release \
            build_profile="$GITHUB_WORKSPACE/$PROFILE" \
            cache_path=~/.scons_cache cache_limit=4 \
            optimize=size lto=full \
            deprecated=no \
            threads=no \
            disable_3d=yes \
            disable_navigation_2d=yes \
            disable_navigation_3d=yes \
            disable_xr=yes \
            minizip=no \
            module_msdfgen_enabled=no \
            module_minimp3_enabled=no \
            module_vorbis_enabled=yes \
            module_svg_enabled=no \
            module_text_server_adv_enabled=no module_text_server_fb_enabled=yes \
            module_websocket_enabled=no module_webrtc_enabled=no \
            module_enet_enabled=no module_upnp_enabled=no \
            module_theora_enabled=no module_webxr_enabled=no \
            module_gridmap_enabled=no module_mobile_vr_enabled=no \
            module_regex_enabled=no \
            module_camera_enabled=no module_noise_enabled=no

      - name: Compile web template (debug)
        working-directory: godot
        run: |
          scons platform=web target=template_debug \
            build_profile="$GITHUB_WORKSPACE/$PROFILE" \
            cache_path=~/.scons_cache cache_limit=4 \
            optimize=size lto=none \
            deprecated=no \
            threads=no \
            disable_3d=yes \
            disable_navigation_2d=yes \
            disable_navigation_3d=yes \
            disable_xr=yes \
            minizip=no \
            module_msdfgen_enabled=no \
            module_minimp3_enabled=no \
            module_vorbis_enabled=yes \
            module_svg_enabled=no \
            module_text_server_adv_enabled=no module_text_server_fb_enabled=yes \
            module_websocket_enabled=no module_webrtc_enabled=no \
            module_enet_enabled=no module_upnp_enabled=no \
            module_theora_enabled=no module_webxr_enabled=no \
            module_gridmap_enabled=no module_mobile_vr_enabled=no \
            module_regex_enabled=no \
            module_camera_enabled=no module_noise_enabled=no

      - name: Stage and rename templates
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          rel=(godot/bin/godot.web.template_release.wasm32*.zip)
          dbg=(godot/bin/godot.web.template_debug.wasm32*.zip)
          test ${#rel[@]} -eq 1 || { echo "release zip not found or ambiguous: ${rel[*]:-none}"; ls -l godot/bin; exit 1; }
          test ${#dbg[@]} -eq 1 || { echo "debug zip not found or ambiguous: ${dbg[*]:-none}"; ls -l godot/bin; exit 1; }
          cp "${rel[0]}" out/web_nothreads_release.zip
          cp "${dbg[0]}" out/web_nothreads_debug.zip
          ls -l out

      - name: Marker scan
        run: |
          set -euo pipefail
          cd out
          for z in web_nothreads_release.zip web_nothreads_debug.zip; do
            echo "== $z"
            unzip -o -q "$z" -d "${z%.zip}"
            W=$(ls "${z%.zip}"/*.wasm)
            for m in Sprite2D ShaderMaterial AudioStreamOggVorbis FontFile JavaScriptBridge CanvasLayer; do
              if grep -qa "$m" "$W"; then echo "  OK $m"; else echo "  MISSING $m"; exit 1; fi
            done
            rm -rf "${z%.zip}"
          done

      - name: Size report
        run: |
          set -euo pipefail
          cd out
          unzip -o -q web_nothreads_release.zip -d rel
          W=$(ls rel/*.wasm)
          gzip -9 -c "$W" > wasm.gz
          brotli -q 11 -c "$W" > wasm.br || true
          printf "raw    %s\n" "$(stat -c %s "$W")"
          printf "gzip   %s\n" "$(stat -c %s wasm.gz)"
          test -s wasm.br && printf "brotli %s\n" "$(stat -c %s wasm.br)"
          rm -rf rel wasm.gz wasm.br

      - uses: actions/upload-artifact@v4
        with:
          name: necrowake_web_template_4_6
          path: out/*.zip
          retention-days: 90
